<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Documento dos compositores e intérpretes do Festival Frevo Sertão 2026." />
		<title>Compositore(a)s / Intérpretes | Festival Frevo Sertão</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Rye&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				color-scheme: dark;
				font-family: "Plus Jakarta Sans", system-ui, sans-serif;
				color: #e2e8f0;
				background: #0f172a;
			}

			* { box-sizing: border-box; }

			body {
				min-height: 100vh;
				margin: 0;
				background: linear-gradient(165deg, rgba(15, 23, 42, .86), rgba(30, 58, 95, .72)), url("fundo%20site%20inicio.png") center / cover fixed;
			}

			.site-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 1rem;
				padding: .85rem clamp(1rem, 4vw, 2rem);
				background: rgba(15, 23, 42, .88);
				border-bottom: 1px solid rgba(255, 255, 255, .18);
			}

			.site-header a { color: #fff; text-decoration: none; }
			.site-header__brand { font-family: Rye, Georgia, serif; }
			.site-header__nav a { color: #cbd5e1; font-size: .9rem; }
			.site-header__nav a:hover { color: #fbbf24; }

			main { width: min(100% - 2rem, 760px); margin: 0 auto; padding: clamp(3rem, 8vw, 6rem) 0; }
			.page-heading { margin-bottom: 2rem; text-align: center; }
			.page-heading__eyebrow { color: #fbbf24; font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
			h1 { margin: .6rem 0 0; color: #fff; font-family: Rye, Georgia, serif; font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1.2; }

			.document-card {
				padding: clamp(1.5rem, 4vw, 2rem);
				border: 1px solid rgba(255, 255, 255, .18);
				border-radius: 1rem;
				background: rgba(255, 255, 255, .08);
				box-shadow: 0 25px 80px rgba(15, 23, 42, .45);
				backdrop-filter: blur(16px);
			}

			.document-card h2 { margin: 0 0 .6rem; color: #fff; font-size: 1.2rem; }
			.document-card p { margin: 0; color: #cbd5e1; }
			.document-card__actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
			.button { display: inline-flex; justify-content: center; padding: .75rem 1.2rem; border-radius: 999px; background: #fbbf24; color: #0f172a; font-size: .9rem; font-weight: 700; text-decoration: none; }
			.button--secondary { border: 1px solid rgba(255, 255, 255, .25); background: transparent; color: #fff; }
			.button:focus-visible, .site-header a:focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }

			@media (max-width: 480px) {
				.site-header { align-items: flex-start; flex-direction: column; }
				.document-card__actions, .button { width: 100%; }
			}
		</style>
	</head>
	<body>
		<header class="site-header">
			<a class="site-header__brand" href="index.html">Festival Frevo Sertão</a>
			<nav class="site-header__nav" aria-label="Navegação principal">
				<a href="index.html">Voltar para o início</a>
			</nav>
		</header>

		<main>
			<header class="page-heading">
				<span class="page-heading__eyebrow">Festival Frevo Sertão 2026</span>
				<h1>Compositore(a)s / Intérpretes</h1>
			</header>

			<article class="document-card">
				<h2>Ficha técnica</h2>
				<p>Documento com as informações dos compositores e intérpretes do festival.</p>
				<div class="document-card__actions">
					<a class="button" href="0%20-%20compositor%20-%20ficha%20t%C3%A9cnica%20(1).pdf" target="_blank" rel="noopener noreferrer">Visualizar PDF</a>
					<a class="button button--secondary" href="0%20-%20compositor%20-%20ficha%20t%C3%A9cnica%20(1).pdf" download>Baixar PDF</a>
				</div>
			</article>
		</main>
	</body>
</html>
